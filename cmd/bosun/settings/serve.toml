# Control-plane configuration. Every field is optional.
listen_addr = "127.0.0.1:8090"
# node_timeout_secs = 30
# data_dir = "data"

# Models are the provider entries personas bind to by name. The api_key may be
# a literal or an `env:VAR` reference read at boot.
# [models.default]
# provider = "anthropic"
# name = "claude-sonnet-4-5"
# api_key = "env:ANTHROPIC_API_KEY"
# price_input_per_mtok = 3
# price_output_per_mtok = 15

# Personas are what sessions run under: a model binding, a permission mode,
# and the tools the session may use ("*" for every canonical tool, or a list
# of canonical tool names).
# [personas.coder]
# model = "default"
# permission = "read_write"
# allowed_tools = "*"
# description = "Makes changes directly"

# A persona's role/behaviour prompt is optional: drop a file named
# <data dir>/personas/<persona name>.md and its text becomes that persona's
# system prompt. Without a file the session uses the built-in default.

# The persona sessions use when none is given.
# default_persona = "coder"
