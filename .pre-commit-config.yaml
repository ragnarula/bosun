# Pre-commit hooks for Bosun
# Install:
#   uv tool install pre-commit
#   pre-commit install
# Run manually: pre-commit run --all-files
#
# Runs fast lints/formatters and clippy on commit.

repos:
  # Stage 1: Fast lints and formatters
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Stage 2: Clippy (slower, but faster than tests)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo +nightly fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
