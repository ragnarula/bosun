# Pre-commit hooks for Bosun
# Install:
#   uv tool install pre-commit
#   pre-commit install
# Run manually: pre-commit run --all-files
#
# Runs fast lints/formatters, clippy, and supply-chain checks on commit.
# cargo deny needs network access on first run to fetch the advisory database.

repos:
  # Stage 1: Fast lints and formatters
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The mermaid bundle is a vendored artifact, not source we edit here, so
      # the whitespace and size checks skip it.
      - id: trailing-whitespace
        exclude: ^crates/bosun-control/src/ui/mermaid\.min\.js$
      - id: end-of-file-fixer
        exclude: ^crates/bosun-control/src/ui/mermaid\.min\.js$
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^crates/bosun-control/src/ui/mermaid\.min\.js$

  # Stage 2: Clippy (slower, but faster than tests)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo +nightly fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        pass_filenames: false
