[workspace]
members = [
    "cmd/bosun",
    "crates/bosun-agent",
    "crates/bosun-common",
    "crates/bosun-control",
    "crates/bosun-executor",
    "crates/bosun-node",
    "crates/bosun-store",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ragnarula/ade"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bosun-agent = { path = "crates/bosun-agent" }
bosun-common = { path = "crates/bosun-common" }
bosun-control = { path = "crates/bosun-control" }
bosun-executor = { path = "crates/bosun-executor" }
bosun-node = { path = "crates/bosun-node" }
bosun-store = { path = "crates/bosun-store" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
bytes = "1"
futures-util = "0.3"
glob = "0.3"
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "tls12", "http1", "rustls-platform-verifier"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
rcgen = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal", "fs", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
