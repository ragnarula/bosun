[workspace]
members = ["cmd/bosun", "crates/bosun-common", "crates/bosun-control", "crates/bosun-node"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ragnarula/ade"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bosun-common = { path = "crates/bosun-common" }
bosun-control = { path = "crates/bosun-control" }
bosun-node = { path = "crates/bosun-node" }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal", "fs", "process"] }
tokio-tungstenite = "0.30"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
