<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="bosun-version" content="{{BOSUN_VERSION}}">
<title>Bosun</title>
<!-- The pane's module runs before the deferred mermaid bundle because it comes
     first: the module listens for the bundle's load event. The preload links
     fetch every module at once, where the imports alone are found one level
     at a time. -->
<script type="module" src="/ui/main.js"></script>
<link rel="modulepreload" href="/ui/dom.js">
<link rel="modulepreload" href="/ui/common.js">
<link rel="modulepreload" href="/ui/machines.js">
<link rel="modulepreload" href="/ui/skills.js">
<link rel="modulepreload" href="/ui/mcp.js">
<link rel="modulepreload" href="/ui/new-session.js">
<link rel="modulepreload" href="/ui/activity.js">
<link rel="modulepreload" href="/ui/session-list.js">
<link rel="modulepreload" href="/ui/history.js">
<link rel="modulepreload" href="/ui/session-view.js">
<link rel="modulepreload" href="/ui/composer.js">
<link rel="modulepreload" href="/ui/scroll.js">
<link rel="modulepreload" href="/ui/viewport.js">
<link rel="modulepreload" href="/ui/transcript.js">
<link rel="modulepreload" href="/ui/diagram.js">
<link rel="modulepreload" href="/ui/markdown.js">
<link rel="modulepreload" href="/ui/subagents.js">
<link rel="modulepreload" href="/ui/earlier.js">
<script src="/ui/mermaid.min.js" id="mermaid-bundle" defer></script>
<link rel="stylesheet" href="/ui/pane.css">
</head>
<body>
<header class="top">
  <h1>Bosun</h1>
  <span class="origin" id="origin"></span>
</header>
<div id="status"></div>
<div id="health-strip" role="button" tabindex="0">
  <span class="health-dot" id="health-dot"></span>
  <span class="health-text" id="health-text"></span>
</div>
<div id="skills-strip" role="button" tabindex="0">
  <span class="skills-strip-icon">✦</span>
  <span class="skills-strip-text" id="skills-strip-text">skill repos</span>
</div>
<div id="mcp-strip" role="button" tabindex="0">
  <span class="mcp-strip-icon">⛓</span>
  <span class="mcp-strip-text" id="mcp-strip-text">MCP servers</span>
</div>
<main>
  <section class="panel">
    <h2>Sessions <button id="btn-new-session" type="button">New session</button></h2>
    <form id="new-session-form" hidden>
      <div class="sheet-body">
        <div id="recent-sessions" hidden></div>
        <div class="composer" id="composer">
          <div class="composer-row">
            <span class="composer-label">Node</span>
            <div class="chip-row" id="node-chips"></div>
            <select id="form-node" hidden></select>
          </div>
          <div class="composer-row">
            <span class="composer-label">Directory</span>
            <div class="dir-pick">
              <span id="form-dir"></span>
              <button type="button" id="btn-browse">Browse</button>
            </div>
            <div id="dir-browser" hidden>
              <div class="dir-browser-head">
                <span id="dir-path">browse roots</span>
                <button type="button" id="btn-dir-close" class="dir-close">Close</button>
              </div>
              <div id="dir-entries"></div>
              <div class="dir-browser-actions">
                <button type="button" id="btn-dir-up" disabled>Up</button>
                <button type="button" id="btn-dir-use" disabled>Use this directory</button>
              </div>
            </div>
          </div>
          <div class="composer-row">
            <span class="composer-label">Persona</span>
            <div class="chip-row" id="persona-chips"></div>
            <select id="form-persona" hidden></select>
          </div>
          <div class="composer-row">
            <span class="composer-label">MCP servers</span>
            <div class="chip-row" id="mcp-chips"></div>
          </div>
        </div>
      </div>
      <div class="sheet-actions">
        <button type="submit" class="start">Start</button>
        <button type="button" id="btn-cancel-new-session">Cancel</button>
      </div>
    </form>
    <div id="session-list" hidden></div>
  </section>
</main>

<div id="machines-tab" hidden>
  <div class="machines-head">
    <button type="button" id="btn-machines-back" title="Back to sessions">‹</button>
    <span class="machines-title">Machines</span>
  </div>
  <div id="machines-list"></div>
</div>

<div id="skills-tab" hidden>
  <div class="skills-head">
    <button type="button" id="btn-skills-back" title="Back to sessions">‹</button>
    <span class="skills-title">Skill repos</span>
    <button type="button" id="btn-skills-add">Add repo</button>
  </div>
  <div id="skills-add" hidden>
    <label>Repo
      <input id="form-skill-repo" type="text" placeholder="owner/repo" autocomplete="off">
    </label>
    <label id="skill-ref-label" hidden>Branch, tag, or sha
      <input id="form-skill-ref" type="text" placeholder="default branch" autocomplete="off">
    </label>
    <button type="button" id="btn-ref-toggle" class="btn-ref-toggle">track a branch, tag, or sha</button>
    <div class="skills-add-actions">
      <button type="button" id="btn-skill-repo-add" class="primary">Add</button>
      <button type="button" id="btn-skill-repo-cancel">Cancel</button>
    </div>
  </div>
  <div id="skills-list"></div>
</div>

<div id="mcp-tab" hidden>
  <div class="mcp-head">
    <button type="button" id="btn-mcp-back" title="Back to sessions">‹</button>
    <span class="mcp-title">MCP servers</span>
    <button type="button" id="btn-mcp-add">Add server</button>
  </div>
  <div id="mcp-add" hidden>
    <label>Name
      <input id="form-mcp-name" type="text" placeholder="server name" autocomplete="off">
    </label>
    <label>URL
      <input id="form-mcp-url" type="text" placeholder="https://server.example/mcp" autocomplete="off">
    </label>
    <label>Auth
      <select id="form-mcp-auth">
        <option value="none" selected>None</option>
        <option value="bearer">Bearer</option>
        <option value="oauth">OAuth</option>
      </select>
    </label>
    <label id="mcp-bearer-label" hidden>Bearer token or header value
      <input id="form-mcp-bearer" type="password" placeholder="token" autocomplete="off">
    </label>
    <label id="mcp-oauth-client-label" hidden>Client ID (paste an ID, or a hosted metadata document URL)
      <input id="form-mcp-oauth-client" type="text" placeholder="client ID or https://..." autocomplete="off">
    </label>
    <label id="mcp-oauth-secret-label" hidden>Client secret (optional; leave empty for a public client)
      <input id="form-mcp-oauth-secret" type="password" placeholder="secret" autocomplete="off">
    </label>
    <div class="mcp-add-actions">
      <button type="button" id="btn-mcp-submit" class="primary">Add</button>
      <button type="button" id="btn-mcp-cancel">Cancel</button>
    </div>
  </div>
  <div id="mcp-list"></div>
</div>

<div id="toast" hidden></div>

<div id="session-view" hidden>
  <header class="view-header">
    <button type="button" class="btn-back" id="btn-back" title="Back to sessions">‹</button>
    <div class="view-title" id="view-title">
      <span class="dot" id="view-state-dot"></span>
      <span class="view-main" id="view-main">
        <span class="view-node" id="view-node"></span><span class="view-dir" id="view-dir"></span>
        <span class="view-waiting" id="view-waiting" hidden></span>
      </span>
    </div>
    <button type="button" class="btn-more" id="btn-more" title="Session actions">⋯</button>
  </header>
  <div id="activity-log" hidden></div>
  <div id="conversation">
    <div id="transcript-wrap">
      <div id="transcript"></div>
      <button type="button" id="btn-bottom" hidden title="Back to the newest line">↓</button>
    </div>
    <div id="child-panel" hidden>
      <div class="child-panel-head">
        <span class="dot" id="child-panel-dot"></span>
        <span class="child-panel-title" id="child-panel-title"></span>
        <button type="button" id="btn-child-collapse" title="Collapse the panel">✕</button>
      </div>
      <div id="child-list"></div>
      <div id="child-transcript"></div>
    </div>
  </div>
  <div id="watch-banner" hidden>
    <div class="watch-note">watching child session — it is read-only</div>
    <button type="button" id="btn-watch-open">Open to act</button>
  </div>
  <div class="input-row" id="input-row">
    <div id="ask-sheet" hidden>
      <div class="ask-head">
        <span class="ask-label">Question</span>
        <button type="button" id="btn-ask-dismiss" class="ask-dismiss" title="Reject the question; your next message becomes an instruction">Dismiss</button>
      </div>
      <div class="ask-chips" id="ask-chips"></div>
      <button type="button" id="btn-ask-type" class="ask-type-toggle" hidden>Answer in your own words</button>
      <div class="ask-free" id="ask-free" hidden>
        <textarea id="ask-input" rows="2" placeholder="Type your answer; Enter to send"></textarea>
        <div class="ask-free-actions">
          <button type="button" id="btn-ask-send" class="primary">Answer</button>
          <button type="button" id="btn-ask-back">Back to options</button>
        </div>
      </div>
    </div>
    <div class="chat-row" id="chat-row">
      <textarea id="input" rows="3" placeholder="Message"></textarea>
      <button id="btn-send" type="button">Send</button>
    </div>
  </div>
</div>

<div id="view-sheet" hidden>
  <div class="view-sheet-head">
    <span>Session actions</span>
    <button type="button" id="btn-sheet-close" title="Close actions">✕</button>
  </div>
  <div class="view-sheet-row" id="row-permission">
    <span class="view-sheet-note" id="view-sheet-meta"></span>
    <button type="button" id="btn-permission">Switch to read-only</button>
    <span class="view-sheet-note" id="view-permission"></span>
  </div>
  <div class="view-sheet-row" id="row-persona">
    <select id="persona-name">
      <option value="">switch persona…</option>
    </select>
    <button type="button" id="btn-persona">Switch persona</button>
  </div>
  <div class="view-sheet-row">
    <span class="view-sheet-copy" id="view-id-copy" title="Session id"></span>
    <button type="button" id="btn-copy-id">Copy session id</button>
  </div>
  <div class="view-sheet-row" id="row-fork">
    <button type="button" id="btn-fork">Fork session</button>
    <span class="view-sheet-note" id="view-fork"></span>
  </div>
  <div class="view-sheet-row" id="row-interrupt">
    <button type="button" id="btn-interrupt">Interrupt</button>
  </div>
  <div class="view-sheet-row" id="row-stop">
    <button type="button" id="btn-stop" class="danger">Stop</button>
  </div>
</div>
</body>
</html>
