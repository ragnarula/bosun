<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bosun</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #10131a;
    --panel: #161a22;
    --panel-2: #1d2230;
    --border: #2b3242;
    --text: #d8dde6;
    --muted: #8a93a3;
    --accent: #5b8cff;
    --user: #d3b072;
    --mono: #9fb7cc;
    --error: #ff7070;
    --ok: #4ed48e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  header.top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header.top h1 { margin: 0; font-size: 18px; }
  header.top .origin { color: var(--muted); font-size: 13px; }
  #status { min-height: 20px; padding: 3px 20px 7px; color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 0 20px 20px;
    align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .panel h2 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  th {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--panel-2); }
  .empty { color: var(--muted); }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.up { background: var(--ok); }
  .dot.down { background: var(--error); }
  #new-session-form {
    display: grid;
    gap: 10px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  #new-session-form[hidden] { display: none; }
  #new-session-form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  #new-session-form input, #new-session-form select, #new-session-form textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    font: inherit;
  }
  #new-session-form .actions { display: flex; gap: 8px; }
  .dir-pick { display: flex; gap: 6px; }
  .dir-pick input { flex: 1; }
  #dir-browser {
    display: grid;
    gap: 8px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    font-size: 12px;
  }
  #dir-browser[hidden] { display: none; }
  .dir-browser-head { display: flex; align-items: center; gap: 8px; }
  .dir-browser-head #dir-path { flex: 1; color: var(--muted); word-break: break-all; }
  #dir-entries { display: grid; gap: 4px; max-height: 260px; overflow-y: auto; }
  .dir-entry { display: flex; align-items: center; gap: 8px; padding: 4px 6px; }
  .dir-entry:hover { background: var(--border); }
  .dir-entry .dir-name { flex: 1; word-break: break-all; }
  #session-view {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  #session-view[hidden] { display: none; }
  .view-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .view-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .view-meta .muted { color: var(--muted); }
  .view-meta .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .badge {
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.state { color: var(--accent); border-color: var(--accent); }
  .view-actions { display: flex; gap: 8px; }
  #transcript { flex: 1; overflow-y: auto; padding: 16px 24px; line-height: 1.55; }
  #transcript .msg { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #transcript .msg.user { color: var(--user); }
  #transcript .msg.assistant { color: var(--text); }
  #transcript .line { margin: 0 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #transcript .tool {
    background: var(--panel-2);
    border-radius: 6px;
    padding: 2px 8px;
    display: block;
    cursor: pointer;
  }
  #transcript .tool:hover { background: var(--border); }
  #transcript .tool.error { color: var(--error); }
  #transcript .tool .toggle { color: var(--muted); font-size: 11px; margin-right: 4px; }
  #transcript .tool.open .toggle { color: var(--accent); }
  #transcript .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--mono); }
  #transcript .error { color: var(--error); }
  #transcript .state { color: var(--muted); font-size: 12px; }
  #transcript .summary { color: var(--muted); font-style: italic; }
  #transcript .child-report { color: var(--muted); padding-left: 18px; }
  #transcript .child-link {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #transcript .model-call {
    color: var(--muted);
    opacity: 0.65;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #transcript .unknown { color: var(--muted); font-size: 12px; }
  #transcript .ask {
    margin: 6px 0;
    padding: 10px 14px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: rgba(91, 140, 255, 0.08);
  }
  #transcript .ask .options { margin: 6px 0 0; padding-left: 18px; }
  #transcript .ask .answer { margin-top: 6px; color: var(--ok); }
  #transcript h1, #transcript h2, #transcript h3, #transcript h4, #transcript h5, #transcript h6 {
    margin: 12px 0 4px;
    font-weight: 700;
    line-height: 1.3;
  }
  #transcript h1 { font-size: 18px; }
  #transcript h2 { font-size: 16px; }
  #transcript h3 { font-size: 15px; }
  #transcript h4 { font-size: 14px; }
  #transcript h5, #transcript h6 { font-size: 13px; color: var(--muted); }
  #transcript .msg p { margin: 0 0 6px; }
  #transcript .md-bold { font-weight: 700; }
  #transcript .md-italic { font-style: italic; }
  #transcript .md-code {
    padding: 0 4px;
    border-radius: 4px;
    background: var(--panel-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9em;
  }
  #transcript .md-link { color: var(--accent); text-decoration: underline; }
  #transcript pre.md-pre {
    margin: 6px 0;
    padding: 10px 12px;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--mono);
    white-space: pre;
  }
  #transcript blockquote {
    margin: 4px 0 8px;
    padding: 2px 0 2px 12px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  #transcript blockquote p { margin: 0; }
  #transcript hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  #transcript .md-li { margin: 2px 0; }
  #transcript .md-marker { color: var(--muted); }
  .input-row {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .input-row[hidden] { display: none; }
  .input-row textarea {
    flex: 1;
    resize: vertical;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font: inherit;
  }
  @media (max-width: 640px) {
    header.top { flex-wrap: wrap; padding: 10px 12px; }
    main { padding: 0 12px 16px; }
    #status { padding: 3px 12px 7px; }
    button { min-height: 40px; padding: 8px 14px; }
    #new-session-form input, #new-session-form select, #new-session-form textarea,
    .input-row textarea { font-size: 16px; }
    tbody tr.clickable { -webkit-tap-highlight-color: transparent; }
    tbody tr.clickable:active { background: var(--panel-2); }
    tbody tr.clickable td { padding-top: 12px; padding-bottom: 12px; }
    #dir-entries .dir-entry {
      min-height: 44px;
      padding: 5px 8px;
      -webkit-tap-highlight-color: transparent;
    }
    #dir-entries .dir-entry:active { background: var(--border); }
    .view-header { flex-wrap: wrap; padding: 10px 12px; }
    .view-actions { flex-wrap: wrap; }
    .dir-browser-head { flex-wrap: wrap; }
    #transcript { padding: 12px 14px; }
    .input-row { padding: 12px 14px; }
  }
  @media (max-width: 560px) {
    .col-model, .col-permission { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Bosun</h1>
  <span class="origin" id="origin"></span>
</header>
<div id="status"></div>
<main>
  <section class="panel">
    <h2>Nodes</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Status</th><th>Last seen</th></tr>
      </thead>
      <tbody id="nodes-body"></tbody>
    </table>
  </section>
  <section class="panel">
    <h2>Sessions <button id="btn-new-session" type="button">New session</button></h2>
    <form id="new-session-form" hidden>
      <label>Node
        <select id="form-node" required></select>
      </label>
      <label>Dir
        <span class="dir-pick">
          <input id="form-dir" type="text" required placeholder="/path/to/work" readonly>
          <button type="button" id="btn-browse">Browse</button>
        </span>
      </label>
      <div id="dir-browser" hidden>
        <div class="dir-browser-head">
          <span id="dir-path">browse roots</span>
          <button type="button" id="btn-dir-up" disabled>Up</button>
          <button type="button" id="btn-dir-use" disabled>Use this directory</button>
          <button type="button" id="btn-dir-close">Close</button>
        </div>
        <div id="dir-entries"></div>
      </div>
      <label>Persona
        <input id="form-persona" type="text" placeholder="default persona">
      </label>
      <label>Prompt
        <textarea id="form-prompt" rows="3" placeholder="optional first instruction"></textarea>
      </label>
      <div class="actions">
        <button type="submit">Start</button>
        <button type="button" id="btn-cancel-new-session">Cancel</button>
      </div>
    </form>
    <table>
      <thead>
        <tr><th>Id</th><th>Node</th><th class="col-model">Model</th><th>State</th><th class="col-permission">Permission</th></tr>
      </thead>
      <tbody id="sessions-body"></tbody>
    </table>
  </section>
</main>

<div id="session-view" hidden>
  <header class="view-header">
    <div class="view-meta">
      <span class="id" id="view-id"></span>
      <span class="muted" id="view-node"></span>
      <span class="muted" id="view-model"></span>
      <span class="badge" id="view-persona"></span>
      <span class="badge" id="view-permission"></span>
      <span class="badge" id="view-watch" hidden>watch-only</span>
      <span class="badge state" id="view-state"></span>
    </div>
    <div class="view-actions">
      <button id="btn-interrupt" type="button">Interrupt</button>
      <button id="btn-permission" type="button">Switch to read-only</button>
      <input id="persona-name" type="text" placeholder="persona name" size="14">
      <button id="btn-persona" type="button">Switch persona</button>
      <button id="btn-stop" type="button">Stop</button>
      <button id="btn-close" type="button">Close</button>
    </div>
  </header>
  <div id="transcript"></div>
  <div class="input-row" id="input-row">
    <textarea id="input" rows="3" placeholder="Message (Ctrl+Enter to send, Enter for a new line; while a question is on screen, sending answers it)"></textarea>
    <button id="btn-send" type="button">Send</button>
    <button id="btn-redirect" type="button" title="Send as a new instruction instead of answering the question on screen">Redirect</button>
  </div>
</div>

<script>
'use strict';

const $ = (id) => document.getElementById(id);

const originEl = $('origin');
const statusEl = $('status');
const nodesBody = $('nodes-body');
const sessionsBody = $('sessions-body');
const newSessionBtn = $('btn-new-session');
const newSessionForm = $('new-session-form');
const cancelNewSessionBtn = $('btn-cancel-new-session');
const formNode = $('form-node');
const formDir = $('form-dir');
const btnBrowse = $('btn-browse');
const dirBrowser = $('dir-browser');
const dirPathEl = $('dir-path');
const btnDirUp = $('btn-dir-up');
const btnDirUse = $('btn-dir-use');
const btnDirClose = $('btn-dir-close');
const dirEntries = $('dir-entries');
const formPersona = $('form-persona');
const formPrompt = $('form-prompt');
const view = $('session-view');
const viewId = $('view-id');
const viewNode = $('view-node');
const viewModel = $('view-model');
const viewPersona = $('view-persona');
const viewPermission = $('view-permission');
const viewWatch = $('view-watch');
const viewState = $('view-state');
const inputRow = $('input-row');
const btnInterrupt = $('btn-interrupt');
const btnPermission = $('btn-permission');
const personaName = $('persona-name');
const btnPersona = $('btn-persona');
const btnStop = $('btn-stop');
const btnClose = $('btn-close');
const transcript = $('transcript');
const input = $('input');
const btnSend = $('btn-send');
const btnRedirect = $('btn-redirect');

let nodes = [];
let nodeOptionsSignature = null;
let sessions = [];
let current = null;   // the open session id
let es = null;        // the open EventSource
let liveEl = null;    // the assistant paragraph live deltas stream into
let stick = true;     // auto-scroll the transcript when true
let sending = false;
let dirNode = null;   // the node the directory browser is looking at
let dirPath = null;   // null = the node's browse roots
let dirListing = null;

originEl.textContent = location.origin;

function showStatus(text) {
  statusEl.textContent = text;
}

function ago(secs) {
  const diff = Math.max(0, Math.floor(Date.now() / 1000) - secs);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function cell(text) {
  const td = document.createElement('td');
  td.textContent = text;
  return td;
}

function emptyRow(cols, text) {
  const row = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = cols;
  td.className = 'empty';
  td.textContent = text;
  row.appendChild(td);
  return row;
}

function renderNodes() {
  nodesBody.textContent = '';
  if (nodes.length === 0) {
    nodesBody.appendChild(emptyRow(3, 'no nodes connected'));
    return;
  }
  for (const node of nodes) {
    const row = document.createElement('tr');
    row.appendChild(cell(node.name));
    const status = document.createElement('td');
    const dot = document.createElement('span');
    dot.className = 'dot ' + (node.up ? 'up' : 'down');
    status.appendChild(dot);
    status.appendChild(document.createTextNode(node.up ? 'up' : 'down'));
    row.appendChild(status);
    row.appendChild(cell(ago(node.last_seen_secs)));
    nodesBody.appendChild(row);
  }
}

function renderNodeOptions() {
  const signature = nodes.map((node) => node.name + (node.up ? 'up' : 'down')).join(',');
  if (signature === nodeOptionsSignature) return;
  nodeOptionsSignature = signature;
  const selected = formNode.value;
  formNode.textContent = '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = 'choose a node';
  formNode.appendChild(placeholder);
  for (const node of nodes) {
    const option = document.createElement('option');
    option.value = node.name;
    option.textContent = node.name + (node.up ? '' : ' (down)');
    formNode.appendChild(option);
  }
  if (!selected) return;
  if (nodes.some((node) => node.name === selected)) {
    formNode.value = selected;
    return;
  }
  // The picked node vanished: reuse the change listener to drop the stale dir pick.
  formNode.dispatchEvent(new Event('change'));
}

function shortId(id) {
  return id.length > 8 ? id.slice(0, 8) : id;
}

function renderSessions() {
  sessionsBody.textContent = '';
  if (sessions.length === 0) {
    sessionsBody.appendChild(emptyRow(5, 'no sessions'));
    return;
  }
  // Render the tree: each root row is followed by its children, nested under
  // the session that spawned them at any depth.
  const byParent = new Map();
  for (const session of sessions) {
    const parent = session.parent_id || '';
    if (!byParent.has(parent)) byParent.set(parent, []);
    byParent.get(parent).push(session);
  }
  const renderLevel = (parentId, depth) => {
    const children = (byParent.get(parentId) || []).sort((a, b) =>
      a.id < b.id ? -1 : a.id > b.id ? 1 : 0
    );
    for (const session of children) {
      const row = document.createElement('tr');
      row.className = 'clickable';
      row.title = session.id;
      row.appendChild(cell('  '.repeat(depth) + shortId(session.id)));
      row.appendChild(cell(session.node));
      const model = cell(session.model);
      model.className = 'col-model';
      row.appendChild(model);
      row.appendChild(cell(session.state));
      const permission = cell(session.permission);
      permission.className = 'col-permission';
      row.appendChild(permission);
      row.addEventListener('click', () => openSession(session.id));
      sessionsBody.appendChild(row);
      renderLevel(session.id, depth + 1);
    }
  };
  renderLevel('', 0);
}

async function post(url, body) {
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!response.ok) {
    throw new Error('HTTP ' + response.status + ': ' + (await response.text()));
  }
  return response;
}

let nodesFetching = false;
async function refreshNodes() {
  if (nodesFetching) return;
  nodesFetching = true;
  try {
    const response = await fetch('/nodes');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    nodes = await response.json();
    renderNodes();
    renderNodeOptions();
  } catch (error) {
    showStatus('nodes: ' + error.message);
  } finally {
    nodesFetching = false;
  }
}

let sessionsFetching = false;
async function refreshSessions() {
  if (sessionsFetching) return;
  sessionsFetching = true;
  try {
    const response = await fetch('/sessions');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    sessions = await response.json();
    renderSessions();
    if (current && !sessions.some((session) => session.id === current)) {
      showStatus('session ' + current + ' ended');
      closeSession();
    }
  } catch (error) {
    showStatus('sessions: ' + error.message);
  } finally {
    sessionsFetching = false;
  }
}

newSessionBtn.addEventListener('click', () => {
  newSessionForm.hidden = !newSessionForm.hidden;
  if (!newSessionForm.hidden) {
    if (window.matchMedia('(max-width: 640px)').matches) {
      newSessionForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      formNode.focus();
    }
  }
});

// A picked directory belongs to one node; switch nodes, drop the pick.
formNode.addEventListener('change', () => {
  formDir.value = '';
  dirBrowser.hidden = true;
});

btnBrowse.addEventListener('click', () => {
  const node = formNode.value;
  if (!node) {
    showStatus('choose a node first');
    return;
  }
  dirNode = node;
  dirPath = null;
  dirListing = null;
  dirBrowser.hidden = false;
  loadDirs();
});

btnDirUp.addEventListener('click', () => {
  if (dirPath === null) return;
  dirPath = dirListing && dirListing.parent ? dirListing.parent : null;
  loadDirs();
});

btnDirUse.addEventListener('click', () => {
  if (dirPath === null) return;
  formDir.value = dirPath;
  dirBrowser.hidden = true;
});

btnDirClose.addEventListener('click', () => {
  dirBrowser.hidden = true;
});

async function loadDirs() {
  let url = '/nodes/' + encodeURIComponent(dirNode) + '/dirs';
  if (dirPath) url += '?path=' + encodeURIComponent(dirPath);
  try {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error('HTTP ' + response.status + ': ' + (await response.text()));
    }
    dirListing = await response.json();
    renderDirs();
  } catch (error) {
    showStatus('browse: ' + error.message);
  }
}

function renderDirs() {
  dirPathEl.textContent = dirPath === null ? 'browse roots' : dirPath;
  btnDirUp.disabled = dirPath === null;
  btnDirUse.disabled = dirPath === null;
  dirEntries.textContent = '';
  const entries = (dirListing && dirListing.entries) || [];
  if (entries.length === 0) {
    dirEntries.appendChild(document.createTextNode('(no directories)'));
    return;
  }
  for (const entry of entries) {
    const row = document.createElement('div');
    row.className = 'dir-entry';
    const name = document.createElement('span');
    name.className = 'dir-name';
    name.textContent = entry.name + (entry.is_repo ? ' [repo]' : '');
    row.appendChild(name);
    const open = document.createElement('button');
    open.type = 'button';
    open.textContent = 'Open';
    open.addEventListener('click', () => {
      dirPath = entry.path;
      loadDirs();
    });
    const use = document.createElement('button');
    use.type = 'button';
    use.textContent = 'Use';
    use.addEventListener('click', () => {
      formDir.value = entry.path;
      dirBrowser.hidden = true;
    });
    row.appendChild(open);
    row.appendChild(use);
    dirEntries.appendChild(row);
  }
}

cancelNewSessionBtn.addEventListener('click', () => {
  newSessionForm.hidden = true;
  newSessionForm.reset();
  dirBrowser.hidden = true;
});

newSessionForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const body = {
    node: formNode.value,
    dir: formDir.value.trim(),
  };
  const persona = formPersona.value.trim();
  if (persona) body.persona = persona;
  const prompt = formPrompt.value.trim();
  if (prompt) body.prompt = prompt;
  try {
    // A directory-based session on the node: the executor starts there and
    // the loop can run tools immediately.
    const response = await post('/dev', body);
    const session = await response.json();
    newSessionForm.hidden = true;
    newSessionForm.reset();
    await refreshSessions();
    openSession(session.id);
  } catch (error) {
    showStatus('new session: ' + error.message);
  }
});

function openSession(id) {
  closeSession();
  current = id;
  view.hidden = false;
  const session = sessions.find((s) => s.id === id);
  if (session) updateHeader(session);
  fetchSession(id);
  // EventSource reconnects automatically; durable frames carry the event seq
  // as their SSE id, so the browser resumes with Last-Event-ID.
  es = new EventSource('/sessions/' + encodeURIComponent(id) + '/events');
  es.onmessage = (event) => {
    try {
      handleFrame(JSON.parse(event.data));
    } catch (error) {
      showStatus('events: ' + error.message);
    }
  };
  es.onerror = () => {
    showStatus('events: stream lost, reconnecting');
  };
  if (!inputRow.hidden) input.focus();
}

function closeSession() {
  if (es) {
    es.close();
    es = null;
  }
  current = null;
  liveEl = null;
  transcript.textContent = '';
  input.value = '';
  view.hidden = true;
}

async function fetchSession(id) {
  try {
    const response = await fetch('/sessions/' + encodeURIComponent(id));
    if (!response.ok) throw new Error('HTTP ' + response.status);
    updateHeader(await response.json());
  } catch (error) {
    showStatus('session: ' + error.message);
  }
}

function updateHeader(session) {
  viewId.textContent = session.id;
  viewNode.textContent = session.node;
  viewModel.textContent = session.model;
  viewPersona.textContent = session.persona || '';
  updatePermissionBadge(session.permission);
  viewState.textContent = session.state;
  // A child session is watch-only: its transcript and state render live, but
  // the pane offers no input path and no user actions toward it.
  const watchOnly = !!session.parent_id;
  viewWatch.hidden = !watchOnly;
  inputRow.hidden = watchOnly;
  btnInterrupt.disabled = watchOnly;
  btnPermission.disabled = watchOnly;
  personaName.disabled = watchOnly;
  btnPersona.disabled = watchOnly;
  btnStop.disabled = watchOnly;
}

function updatePermissionBadge(permission) {
  viewPermission.textContent = permission;
  btnPermission.textContent =
    permission === 'read_only' ? 'Switch to read-write' : 'Switch to read-only';
}

btnInterrupt.addEventListener('click', async () => {
  try {
    await post('/sessions/' + encodeURIComponent(current) + '/interrupt', {});
  } catch (error) {
    showStatus('interrupt: ' + error.message);
  }
});

btnPermission.addEventListener('click', async () => {
  const next = viewPermission.textContent === 'read_only' ? 'read_write' : 'read_only';
  try {
    await post('/sessions/' + encodeURIComponent(current) + '/permission', {
      permission: next,
    });
  } catch (error) {
    showStatus('permission: ' + error.message);
  }
});

btnPersona.addEventListener('click', async () => {
  const name = personaName.value.trim();
  if (!name) {
    showStatus('persona: type a persona name first');
    return;
  }
  try {
    await post('/sessions/' + encodeURIComponent(current) + '/persona', { persona: name });
    personaName.value = '';
    await fetchSession(current);
  } catch (error) {
    showStatus('persona: ' + error.message);
  }
});

btnStop.addEventListener('click', async () => {
  if (!window.confirm('Stop and delete this session?')) return;
  try {
    await post('/stop', { session_id: current });
    showStatus('session stopped');
    closeSession();
    await refreshSessions();
  } catch (error) {
    showStatus('stop: ' + error.message);
  }
});

btnClose.addEventListener('click', closeSession);

async function send(redirect) {
  if (sending || !input.value.trim()) return;
  sending = true;
  btnSend.disabled = true;
  btnRedirect.disabled = true;
  try {
    await post('/sessions/' + encodeURIComponent(current) + '/messages', {
      content: input.value,
      redirect: !!redirect,
    });
    input.value = '';
  } catch (error) {
    showStatus('send: ' + error.message);
  } finally {
    sending = false;
    btnSend.disabled = false;
    btnRedirect.disabled = false;
    input.focus();
  }
}

btnSend.addEventListener('click', () => send(false));
btnRedirect.addEventListener('click', () => send(true));
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    send(false);
  }
});

function scrollToBottom() {
  if (stick) transcript.scrollTop = transcript.scrollHeight;
}

transcript.addEventListener('scroll', () => {
  stick = transcript.scrollTop + transcript.clientHeight >= transcript.scrollHeight - 40;
});

function appendLine(kind, text) {
  const line = document.createElement('div');
  line.className = 'line ' + kind;
  line.textContent = text;
  transcript.appendChild(line);
  scrollToBottom();
}

// Tool traffic renders as one subtle strip so assistant text is not buried
// under long tool output. The strip is quiet by default; the payload stays
// hidden until the strip is clicked.
function appendToolLine(kind, payload) {
  const line = document.createElement('div');
  line.className = 'line ' + kind;
  const toggle = document.createElement('span');
  toggle.className = 'toggle';
  toggle.textContent = '▸';
  const body = document.createElement('span');
  body.hidden = true;
  line.appendChild(toggle);
  line.appendChild(body);
  line.addEventListener('click', () => {
    const wasOpen = !body.hidden;
    if (wasOpen) {
      body.hidden = true;
      line.classList.remove('open');
      toggle.textContent = '▸';
      return;
    }
    body.textContent = payload;
    body.hidden = false;
    line.classList.add('open');
    toggle.textContent = '▾';
    scrollToBottom();
  });
  transcript.appendChild(line);
  scrollToBottom();
}

// A tool result for a human reader: strings read raw and structure flattens
// to `key: value` and `- item` lines instead of JSON.
function readableValue(value) {
  if (typeof value === 'string') return value;
  if (value === null) return 'null';
  if (Array.isArray(value)) {
    return value.map((item) => '- ' + readableValue(item)).join('\n');
  }
  if (typeof value === 'object') {
    return Object.keys(value)
      .map((key) => key + ': ' + readableValue(value[key]))
      .join('\n');
  }
  return String(value);
}

function appendMsg(role, text) {
  const paragraph = document.createElement('p');
  paragraph.className = 'msg ' + role;
  paragraph.textContent = text;
  transcript.appendChild(paragraph);
  scrollToBottom();
}

// Assistant turns render markdown like the terminal client; user text stays
// plain. Renders the same subset the TUI parses: headings, emphasis, inline
// code, code fences, links, lists, blockquotes, and rules.
function appendAssistant(text) {
  const container = document.createElement('div');
  container.className = 'msg assistant';
  renderMarkdown(container, text);
  transcript.appendChild(container);
  scrollToBottom();
}

function renderMarkdown(container, text) {
  const lines = text.split('\n');
  let inCode = false;
  let code = [];
  let para = [];
  const paraOut = () => {
    if (para.length === 0) return;
    const paragraph = document.createElement('p');
    appendInline(paragraph, para.join('\n'));
    container.appendChild(paragraph);
    para = [];
  };
  const codeOut = () => {
    if (code.length === 0) return;
    const pre = document.createElement('pre');
    pre.className = 'md-pre';
    pre.textContent = code.join('\n');
    container.appendChild(pre);
    code = [];
  };
  let i = 0;
  while (i < lines.length) {
    const raw = lines[i];
    if (inCode) {
      if (raw.trimStart().startsWith('```')) {
        inCode = false;
        codeOut();
      } else {
        code.push(raw);
      }
      i += 1;
      continue;
    }
    const line = raw.trim();
    if (line.startsWith('```')) {
      paraOut();
      inCode = true;
      i += 1;
      continue;
    }
    if (line === '') {
      paraOut();
      i += 1;
      continue;
    }
    const heading = headingLevel(line);
    if (heading > 0) {
      paraOut();
      const el = document.createElement('h' + heading);
      appendInline(el, line.slice(heading).trim());
      container.appendChild(el);
      i += 1;
      continue;
    }
    if (isRule(line)) {
      paraOut();
      container.appendChild(document.createElement('hr'));
      i += 1;
      continue;
    }
    if (line.startsWith('>')) {
      paraOut();
      const quote = document.createElement('blockquote');
      while (i < lines.length && lines[i].trimStart().startsWith('>')) {
        const paragraph = document.createElement('p');
        appendInline(paragraph, lines[i].trimStart().slice(1).trim());
        quote.appendChild(paragraph);
        i += 1;
      }
      container.appendChild(quote);
      continue;
    }
    const marker = listMarker(line);
    if (marker !== null) {
      paraOut();
      const item = document.createElement('div');
      item.className = 'md-li';
      const bullet = document.createElement('span');
      bullet.className = 'md-marker';
      bullet.textContent = marker;
      item.appendChild(bullet);
      appendInline(item, line.slice(marker.length));
      container.appendChild(item);
      i += 1;
      continue;
    }
    para.push(line);
    i += 1;
  }
  paraOut();
  if (inCode && code.length > 0) codeOut();
}

function headingLevel(line) {
  let hashes = 0;
  while (hashes < line.length && line[hashes] === '#') hashes += 1;
  if (hashes < 1 || hashes > 6) return 0;
  const rest = line[hashes];
  return rest === ' ' || rest === '\t' ? hashes : 0;
}

function isRule(line) {
  if (line.length < 3) return false;
  for (const char of line) {
    if (char !== '-' && char !== '*' && char !== '_') return false;
  }
  return true;
}

function listMarker(line) {
  if (/^[-*+]\s/.test(line)) return '• ';
  const numbered = line.match(/^\d+([.)])\s/);
  return numbered ? numbered[0].slice(0, -1) + ' ' : null;
}

// Splits inline text into styled tokens. Underscores stay literal so names
// like `file_name` are not split into italics.
function parseInline(text) {
  const chars = Array.from(text);
  const tokens = [];
  let run = '';
  let bold = false;
  let italic = false;
  let code = false;
  const flush = () => {
    if (run === '') return;
    tokens.push({ text: run, bold, italic, code });
    run = '';
  };
  let i = 0;
  while (i < chars.length) {
    const char = chars[i];
    if (char === '`') {
      flush();
      code = !code;
      i += 1;
      continue;
    }
    if (char === '*') {
      let count = 0;
      while (chars[i + count] === '*') count += 1;
      flush();
      if (count === 3) {
        bold = !bold;
        italic = !italic;
      } else if (count === 2) {
        bold = !bold;
      } else {
        italic = !italic;
      }
      i += count;
      continue;
    }
    if (char === '[') {
      const close = chars.indexOf(']', i + 1);
      if (close !== -1 && chars[close + 1] === '(') {
        const paren = chars.indexOf(')', close + 2);
        if (paren !== -1) {
          flush();
          tokens.push({
            text: chars.slice(i + 1, close).join(''),
            url: chars.slice(close + 2, paren).join(''),
          });
          i = paren + 1;
          continue;
        }
      }
      run += '[';
      i += 1;
      continue;
    }
    run += char;
    i += 1;
  }
  flush();
  return tokens;
}

function appendInline(parent, text) {
  for (const token of parseInline(text)) {
    if (token.url) {
      const link = document.createElement('a');
      link.className = 'md-link';
      link.href = token.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = token.text;
      parent.appendChild(link);
      continue;
    }
    const classes = [];
    if (token.bold) classes.push('md-bold');
    if (token.italic) classes.push('md-italic');
    if (token.code) classes.push('md-code');
    if (classes.length === 0) {
      parent.appendChild(document.createTextNode(token.text));
      continue;
    }
    const span = document.createElement('span');
    span.className = classes.join(' ');
    span.textContent = token.text;
    parent.appendChild(span);
  }
}

// Live deltas stream into one assistant paragraph until the turn's durable
// text arrives (which supersedes the stream) or another message begins.
function appendDelta(text) {
  if (!liveEl) {
    liveEl = document.createElement('p');
    liveEl.className = 'msg assistant';
    transcript.appendChild(liveEl);
  }
  liveEl.textContent += text;
  scrollToBottom();
}

function closeLive() {
  liveEl = null;
}

function renderMessage(message) {
  const block = message.block;
  if (message.role === 'assistant' && block.kind === 'text') {
    if (liveEl) {
      const container = document.createElement('div');
      container.className = 'msg assistant';
      renderMarkdown(container, block.text);
      liveEl.replaceWith(container);
      liveEl = null;
      scrollToBottom();
      return;
    }
    appendAssistant(block.text);
    return;
  }
  // Tool-streamed output streams into a live assistant paragraph while the
  // executor runs; it is tool output, not assistant prose, so the moment a
  // durable tool frame lands the live paragraph is dropped rather than left
  // in the transcript. The full output still lives inside the collapsed strip.
  if (block.kind === 'tool_call' || block.kind === 'tool_result') {
    if (liveEl) {
      liveEl.remove();
      liveEl = null;
    }
  } else {
    closeLive();
  }
  switch (block.kind) {
    case 'text':
      appendMsg(message.role === 'user' ? 'user' : 'assistant', block.text);
      break;
    case 'tool_call': {
      const args = block.args == null ? {} : block.args;
      appendToolLine('tool', readableValue(args));
      break;
    }
    case 'tool_result': {
      const content = block.content;
      appendToolLine(
        block.is_error ? 'tool error' : 'tool',
        typeof content === 'string' || content === null
          ? String(content)
          : readableValue(content)
      );
      break;
    }
    case 'ask': {
      const box = document.createElement('div');
      box.className = 'ask';
      const question = document.createElement('div');
      question.textContent = block.child_id
        ? 'child ' + block.child_id + ' asks: ' + block.message
        : block.message;
      box.appendChild(question);
      const options = document.createElement('ul');
      options.className = 'options';
      for (const option of block.options || []) {
        const item = document.createElement('li');
        item.textContent = option;
        options.appendChild(item);
      }
      box.appendChild(options);
      if (block.answer) {
        const answer = document.createElement('div');
        answer.className = 'answer';
        answer.textContent = 'answered: ' + block.answer;
        box.appendChild(answer);
      }
      transcript.appendChild(box);
      scrollToBottom();
      break;
    }
    case 'summary':
      appendLine('summary', '[summary] ' + block.text);
      break;
    case 'child_event': {
      // Child activity renders as one line whose child id expands into that
      // child's own thread (watch-only): clicking it attaches the view.
      const line = document.createElement('div');
      line.className = 'line child-report';
      const head = document.createElement('span');
      head.textContent = '[child ';
      line.appendChild(head);
      const link = document.createElement('span');
      link.className = 'child-link';
      link.textContent = block.child_id;
      link.title = 'expand child ' + block.child_id + ' (watch-only)';
      link.addEventListener('click', () => openSession(block.child_id));
      line.appendChild(link);
      const tail = document.createElement('span');
      tail.textContent = ' ' + (block.event_kind || 'report') + '] ' + block.text;
      line.appendChild(tail);
      transcript.appendChild(line);
      scrollToBottom();
      break;
    }
    default:
      appendLine('unknown', JSON.stringify(block));
      break;
  }
}

function renderModelCall(event) {
  const detail = [];
  if (event.input_tokens != null) detail.push('in=' + event.input_tokens);
  if (event.output_tokens != null) detail.push('out=' + event.output_tokens);
  const suffix = detail.length > 0 ? ' ' + detail.join(' ') : '';
  appendLine('model-call', '[model ' + event.model + suffix + ']');
}

function handleEvent(event) {
  switch (event.kind) {
    case 'message':
      renderMessage(event.message);
      break;
    case 'state':
      appendLine('state', '* ' + event.state);
      viewState.textContent = event.state;
      break;
    case 'permission':
      updatePermissionBadge(event.permission);
      break;
    case 'persona':
      appendLine('state', '* persona: ' + event.persona);
      break;
    case 'model_call':
      renderModelCall(event);
      break;
  }
}

function handleFrame(frame) {
  if (Object.prototype.hasOwnProperty.call(frame, 'delta')) {
    appendDelta(frame.delta);
    return;
  }
  if (frame.event) handleEvent(frame.event);
}

refreshNodes();
refreshSessions();
setInterval(refreshNodes, 5000);
setInterval(refreshSessions, 3000);
</script>
</body>
</html>
