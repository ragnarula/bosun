function clearAskChips() {
  askSheet.hidden = true;
  askQuestion.textContent = '';
  askChips.textContent = '';
}

// A tap on an ask option answers the question exactly like a typed message.
async function answer(text) {
  if (sending || !text.trim()) return;
  clearAskChips();
  sending = true;
  try {
    await post('/sessions/' + encodeURIComponent(current) + '/messages', {
      content: text,
      redirect: false,
    });
  } catch (error) {
    toastError('answer: ' + error.message);
  } finally {
    sending = false;
  }
}

async function send(redirect) {
  if (sending || !input.value.trim()) return;
  sending = true;
  btnSend.disabled = true;
  btnRedirect.disabled = true;
  try {
    await post('/sessions/' + encodeURIComponent(current) + '/messages', {
      content: input.value,
      redirect: !!redirect,
    });
    input.value = '';
    clearDraft();
    clearAskChips();
  } catch (error) {
    toastError('send: ' + error.message);
  } finally {
    sending = false;
    btnSend.disabled = false;
    btnRedirect.disabled = false;
    input.focus();
  }
}

btnSend.addEventListener('click', () => send(false));
btnRedirect.addEventListener('click', () => send(true));
// Keep the chat draft in sync with what the user is typing.
input.addEventListener('input', saveDraft);
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    send(false);
  }
});

function scrollToBottom() {
  if (stick) transcript.scrollTop = transcript.scrollHeight;
}

transcript.addEventListener('scroll', () => {
  stick = transcript.scrollTop + transcript.clientHeight >= transcript.scrollHeight - 40;
});

function appendLine(kind, text) {
  const line = document.createElement('div');
  line.className = 'line ' + kind;
  line.textContent = text;
  transcript.appendChild(line);
  scrollToBottom();
}

// Tool traffic renders as one subtle strip so assistant text is not buried
// under long tool output. The strip shows a per-tool glyph, the tool name,
// and the args; the payload stays hidden until the strip is clicked.
function toolGlyph(name) {
  // Mirrors the TUI's `tool_glyph` in `cmd/bosun/src/attach.rs`; keep both in
  // step with the canonical tool list in `crates/bosun-common/src/tool.rs`.
  const glyphs = {
    shell: '$',
    'file_read': '→',
    'file_write': '✎',
    edit: '✎',
    grep: '⌕',
    glob: '✱',
    ask: '?',
    todowrite: '✓',
    git: '⎇',
    webfetch: '↗',
    skill: '⚒',
    spawn: '⊕',
    message_child: '⇄',
  };
  // A hasOwnProperty guard keeps a tool literally named `constructor` or
  // `toString` from printing Object.prototype's function source.
  return Object.prototype.hasOwnProperty.call(glyphs, name) ? glyphs[name] : '⚙';
}

// The compact one-line label for a tool call, opencode-style: the tool name
// plus the arguments that say what it acted on, never the raw JSON. Falls
// back to the first string argument for unknown tools. Whitespace is
// collapsed so a multi-line command or heredoc stays one row; the full args
// live in the hidden body.
function toolSummary(name, args) {
  if (args === null || typeof args !== 'object' || Array.isArray(args)) return name;
  const s = (value) =>
    typeof value === 'string' ? value.replace(/\s+/g, ' ').trim() : '';
  const first = Object.values(args).find((value) => typeof value === 'string') || '';
  switch (name) {
    case 'shell': {
      const command = s(args.command);
      return command ? name + ' ' + clip(command, TOOL_SUMMARY_LIMIT) : name;
    }
    case 'file_read':
    case 'file_write':
    case 'edit':
      return name + (s(args.path) ? ' ' + clip(s(args.path), TOOL_SUMMARY_LIMIT) : '');
    case 'grep':
      return name + (s(args.pattern) ? ' "' + clip(s(args.pattern), TOOL_SUMMARY_LIMIT) + '"' : '');
    case 'glob':
      return name + (s(args.pattern) ? ' "' + clip(s(args.pattern), TOOL_SUMMARY_LIMIT) + '"' : '');
    case 'ask':
      return name + (s(args.message) ? ' "' + clip(s(args.message), TOOL_SUMMARY_LIMIT) + '"' : '');
    case 'todowrite':
      return args.items && args.items.length ? name + ' (' + args.items.length + ')' : name;
    case 'git':
      return Array.isArray(args.args) && args.args.length
        ? 'git ' + clip(args.args.join(' '), TOOL_SUMMARY_LIMIT)
        : 'git';
    case 'webfetch':
      return name + (s(args.url) ? ' ' + clip(s(args.url), TOOL_SUMMARY_LIMIT) : '');
    case 'skill':
      return name + (s(args.name) ? ' "' + clip(s(args.name), TOOL_SUMMARY_LIMIT) + '"' : '');
    case 'spawn':
      return name + (s(args.persona) ? ' ' + clip(s(args.persona), TOOL_SUMMARY_LIMIT) : '');
    case 'message_child':
      return name + (s(args.id) ? ' ' + clip(s(args.id), TOOL_SUMMARY_LIMIT) : '');
    default:
      return first ? name + ' ' + clip(s(first), TOOL_SUMMARY_LIMIT) : name;
  }
}

function clip(text, max) {
  const chars = Array.from(text);
  return chars.length > max ? chars.slice(0, max).join('') + '…' : text;
}

// Mirrors the TUI's `clip` in `cmd/bosun/src/attach.rs`; keep the two in step.

// The one-line label for a shell command or path is clipped so a very long
// command does not wrap the tool strip into many lines.
const TOOL_SUMMARY_LIMIT = 120;

// One-line tool strip: the glyph, the tool name, and a compact label of what
// it acted on. The full args stay hidden until the line is clicked.
function appendToolStrip(name, args) {
  const line = document.createElement('div');
  line.className = 'line tool';
  const glyph = document.createElement('span');
  glyph.className = 'glyph';
  glyph.textContent = toolGlyph(name);
  const toggle = document.createElement('span');
  toggle.className = 'toggle';
  toggle.textContent = '▸';
  const summary = document.createElement('span');
  summary.textContent = toolSummary(name, args);
  const body = document.createElement('span');
  body.hidden = true;
  body.textContent = readableValue(args);
  line.appendChild(toggle);
  line.appendChild(glyph);
  line.appendChild(summary);
  line.appendChild(body);
  line.addEventListener('click', () => {
    const wasOpen = !body.hidden;
    if (wasOpen) {
      body.hidden = true;
      line.classList.remove('open');
      toggle.textContent = '▸';
      return;
    }
    body.hidden = false;
    line.classList.add('open');
    toggle.textContent = '▾';
    scrollToBottom();
  });
  transcript.appendChild(line);
  scrollToBottom();
}

// A tool result nests under its call as a bordered block, so the call and
// its outcome read as one unit. Long output is clipped with a click to
// expand; error results render red with the tool name kept. An empty result
// (a write that returned `{}`) adds nothing beyond the call's strip.
// The preview is shorter than the TUI's `MAX_INLINE_CHARS` (1000) because
// the full text is one click away here, where the TUI row is final.
const TOOL_RESULT_PREVIEW = 400;

function appendToolResult(name, payload, error) {
  const text = payload == null ? '' : String(payload);
  if (!error && text === '') return;
  const line = document.createElement('div');
  line.className = 'tool-result' + (error ? ' error' : '');
  if (error) {
    const label = document.createElement('span');
    label.className = 'error-label';
    label.textContent = name + ' failed';
    line.appendChild(label);
  }
  const preview = clip(text, TOOL_RESULT_PREVIEW);
  const body = document.createElement('span');
  body.textContent = preview;
  line.appendChild(body);
  if (preview !== text) {
    line.classList.add('clipped');
    const hint = document.createElement('span');
    hint.className = 'expand-hint';
    hint.textContent = 'tap to expand';
    line.appendChild(hint);
    line.addEventListener('click', () => {
      if (line.classList.contains('expanded')) {
        body.textContent = preview;
        hint.textContent = 'tap to expand';
        line.classList.remove('expanded');
        line.classList.add('clipped');
      } else {
        body.textContent = text;
        hint.textContent = 'tap to collapse';
        line.classList.add('expanded');
        line.classList.remove('clipped');
      }
      scrollToBottom();
    });
  }
  transcript.appendChild(line);
  scrollToBottom();
}

// A tool result for a human reader: strings read raw and structure flattens
// to `key: value` and `- item` lines instead of JSON.
function readableValue(value) {
  if (typeof value === 'string') return value;
  if (value === null) return 'null';
  if (Array.isArray(value)) {
    return value.map((item) => '- ' + readableValue(item)).join('\n');
  }
  if (typeof value === 'object') {
    return Object.keys(value)
      .map((key) => key + ': ' + readableValue(value[key]))
      .join('\n');
  }
  return String(value);
}

function appendMsg(role, text) {
  const paragraph = document.createElement('p');
  paragraph.className = 'msg ' + role;
  paragraph.textContent = text;
  transcript.appendChild(paragraph);
  scrollToBottom();
}

// Assistant turns render markdown like the terminal client; user text stays
// plain. Renders the same subset the TUI parses: headings, emphasis, inline
// code, code fences, links, lists, blockquotes, and rules.
function appendAssistant(text) {
  const container = document.createElement('div');
  container.className = 'msg assistant';
  renderMarkdown(container, text);
  transcript.appendChild(container);
  scrollToBottom();
}

function renderMarkdown(container, text) {
  const lines = text.split('\n');
  let inCode = false;
  let code = [];
  let para = [];
  const paraOut = () => {
    if (para.length === 0) return;
    const paragraph = document.createElement('p');
    appendInline(paragraph, para.join('\n'));
    container.appendChild(paragraph);
    para = [];
  };
  const codeOut = () => {
    if (code.length === 0) return;
    const pre = document.createElement('pre');
    pre.className = 'md-pre';
    pre.textContent = code.join('\n');
    container.appendChild(pre);
    code = [];
  };
  let i = 0;
  while (i < lines.length) {
    const raw = lines[i];
    if (inCode) {
      if (raw.trimStart().startsWith('```')) {
        inCode = false;
        codeOut();
      } else {
        code.push(raw);
      }
      i += 1;
      continue;
    }
    const line = raw.trim();
    if (line.startsWith('```')) {
      paraOut();
      inCode = true;
      i += 1;
      continue;
    }
    if (line === '') {
      paraOut();
      i += 1;
      continue;
    }
    const heading = headingLevel(line);
    if (heading > 0) {
      paraOut();
      const el = document.createElement('h' + heading);
      appendInline(el, line.slice(heading).trim());
      container.appendChild(el);
      i += 1;
      continue;
    }
    if (isRule(line)) {
      paraOut();
      container.appendChild(document.createElement('hr'));
      i += 1;
      continue;
    }
    if (line.startsWith('>')) {
      paraOut();
      const quote = document.createElement('blockquote');
      while (i < lines.length && lines[i].trimStart().startsWith('>')) {
        const paragraph = document.createElement('p');
        appendInline(paragraph, lines[i].trimStart().slice(1).trim());
        quote.appendChild(paragraph);
        i += 1;
      }
      container.appendChild(quote);
      continue;
    }
    const marker = listMarker(line);
    if (marker !== null) {
      paraOut();
      const item = document.createElement('div');
      item.className = 'md-li';
      const bullet = document.createElement('span');
      bullet.className = 'md-marker';
      bullet.textContent = marker;
      item.appendChild(bullet);
      appendInline(item, line.slice(marker.length));
      container.appendChild(item);
      i += 1;
      continue;
    }
    para.push(line);
    i += 1;
  }
  paraOut();
  if (inCode && code.length > 0) codeOut();
}

function headingLevel(line) {
  let hashes = 0;
  while (hashes < line.length && line[hashes] === '#') hashes += 1;
  if (hashes < 1 || hashes > 6) return 0;
  const rest = line[hashes];
  return rest === ' ' || rest === '\t' ? hashes : 0;
}

function isRule(line) {
  if (line.length < 3) return false;
  for (const char of line) {
    if (char !== '-' && char !== '*' && char !== '_') return false;
  }
  return true;
}

function listMarker(line) {
  if (/^[-*+]\s/.test(line)) return '• ';
  const numbered = line.match(/^\d+([.)])\s/);
  return numbered ? numbered[0].slice(0, -1) + ' ' : null;
}

// Splits inline text into styled tokens. Underscores stay literal so names
// like `file_name` are not split into italics.
function parseInline(text) {
  const chars = Array.from(text);
  const tokens = [];
  let run = '';
  let bold = false;
  let italic = false;
  let code = false;
  const flush = () => {
    if (run === '') return;
    tokens.push({ text: run, bold, italic, code });
    run = '';
  };
  let i = 0;
  while (i < chars.length) {
    const char = chars[i];
    if (char === '`') {
      flush();
      code = !code;
      i += 1;
      continue;
    }
    if (char === '*') {
      let count = 0;
      while (chars[i + count] === '*') count += 1;
      flush();
      if (count === 3) {
        bold = !bold;
        italic = !italic;
      } else if (count === 2) {
        bold = !bold;
      } else {
        italic = !italic;
      }
      i += count;
      continue;
    }
    if (char === '[') {
      const close = chars.indexOf(']', i + 1);
      if (close !== -1 && chars[close + 1] === '(') {
        const paren = chars.indexOf(')', close + 2);
        if (paren !== -1) {
          flush();
          tokens.push({
            text: chars.slice(i + 1, close).join(''),
            url: chars.slice(close + 2, paren).join(''),
          });
          i = paren + 1;
          continue;
        }
      }
      run += '[';
      i += 1;
      continue;
    }
    run += char;
    i += 1;
  }
  flush();
  return tokens;
}

function appendInline(parent, text) {
  for (const token of parseInline(text)) {
    if (token.url) {
      const link = document.createElement('a');
      link.className = 'md-link';
      link.href = token.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = token.text;
      parent.appendChild(link);
      continue;
    }
    const classes = [];
    if (token.bold) classes.push('md-bold');
    if (token.italic) classes.push('md-italic');
    if (token.code) classes.push('md-code');
    if (classes.length === 0) {
      parent.appendChild(document.createTextNode(token.text));
      continue;
    }
    const span = document.createElement('span');
    span.className = classes.join(' ');
    span.textContent = token.text;
    parent.appendChild(span);
  }
}

// Live deltas stream into one assistant paragraph until the turn's durable
// text arrives (which supersedes the stream) or another message begins.
function appendDelta(text) {
  if (!liveEl) {
    liveEl = document.createElement('p');
    liveEl.className = 'msg assistant';
    transcript.appendChild(liveEl);
  }
  liveEl.textContent += text;
  scrollToBottom();
}

function closeLive() {
  liveEl = null;
}

function renderMessage(message) {
  const block = message.block;
  if (message.role === 'assistant' && block.kind === 'text') {
    if (liveEl) {
      const container = document.createElement('div');
      container.className = 'msg assistant';
      renderMarkdown(container, block.text);
      liveEl.replaceWith(container);
      liveEl = null;
      scrollToBottom();
      return;
    }
    appendAssistant(block.text);
    return;
  }
  // Tool-streamed output streams into a live assistant paragraph while the
  // executor runs; it is tool output, not assistant prose, so the moment a
  // durable tool frame lands the live paragraph is dropped rather than left
  // in the transcript. The full output still lives inside the collapsed strip.
  if (block.kind === 'tool_call' || block.kind === 'tool_result') {
    if (liveEl) {
      liveEl.remove();
      liveEl = null;
    }
  } else {
    closeLive();
  }
  switch (block.kind) {
    case 'text':
      appendMsg(message.role === 'user' ? 'user' : 'assistant', block.text);
      break;
    case 'tool_call': {
      const args = block.args == null ? {} : block.args;
      appendToolStrip(block.name, args);
      break;
    }
    case 'tool_result': {
      const content = block.content;
      const payload =
        typeof content === 'string' || content === null
          ? String(content)
          : readableValue(content);
      appendToolResult(block.name, payload, block.is_error);
      break;
    }
    case 'ask': {
      const box = document.createElement('div');
      box.className = 'ask';
      const question = document.createElement('div');
      if (block.child_id) {
        const to = document.createElement('span');
        to.className = 'ask-to';
        to.textContent = 'child ' + block.child_id + ' asks: ';
        question.appendChild(to);
      }
      question.appendChild(document.createTextNode(block.message));
      box.appendChild(question);
      const options = document.createElement('ul');
      options.className = 'options';
      for (const option of block.options || []) {
        const item = document.createElement('li');
        item.textContent = option;
        options.appendChild(item);
      }
      box.appendChild(options);
      if (block.answer) {
        const answer = document.createElement('div');
        answer.className = 'answer';
        answer.textContent = 'answered: ' + block.answer;
        box.appendChild(answer);
        // An answered ask is history, not a live question: the input row
        // must not keep an open chip set for it.
        clearAskChips();
      } else if (block.options && block.options.length > 0) {
        // The live question: its options become thumb-width chips in the
        // input area, so answering is one tap, never typing.
        askQuestion.textContent = block.message;
        askChips.textContent = '';
        for (const option of block.options) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.textContent = option;
          chip.addEventListener('click', () => answer(option));
          askChips.appendChild(chip);
        }
        askSheet.hidden = false;
      }
      transcript.appendChild(box);
      scrollToBottom();
      break;
    }
    case 'summary':
      appendLine('summary', block.text);
      break;
    case 'child_event': {
      // Child activity renders as one line whose child id expands into that
      // child's own thread (watch-only): clicking it attaches the view.
      const line = document.createElement('div');
      line.className = 'line child-report';
      const head = document.createElement('span');
      head.textContent = '[child ';
      line.appendChild(head);
      const link = document.createElement('span');
      link.className = 'child-link';
      link.textContent = block.child_id;
      link.title = 'expand child ' + block.child_id + ' (watch-only)';
      link.addEventListener('click', () => openSession(block.child_id));
      line.appendChild(link);
      const tail = document.createElement('span');
      tail.textContent = ' ' + (block.event_kind || 'report') + '] ' + block.text;
      line.appendChild(tail);
      transcript.appendChild(line);
      scrollToBottom();
      break;
    }
    default:
      appendLine('unknown', JSON.stringify(block));
      break;
  }
}

function handleEvent(event) {
  switch (event.kind) {
    case 'message':
      renderMessage(event.message);
      break;
    case 'state':
      // The current state lives once, in the header dot; a transcript line
      // would repeat what is already on screen.
      viewStateDot.className = 'dot ' + event.state;
      if (current) {
        const waiting = liveChildrenLabel({ id: current, state: event.state });
        viewWaiting.hidden = waiting === event.state;
        viewWaiting.textContent = waiting;
      }
      break;
    case 'permission':
      updatePermissionBadge(event.permission);
      break;
    case 'persona':
      // The persona lives once, in the ⋯ sheet's metadata row; nothing is
      // added to the transcript.
      break;
    case 'model_call':
      // Model calls are metering history, not conversation: the model is a
      // session fact shown in the ⋯ sheet. No separator line is appended.
      break;
  }
}

function handleFrame(frame) {
  if (Object.prototype.hasOwnProperty.call(frame, 'delta')) {
    appendDelta(frame.delta);
    return;
  }
  if (frame.event) handleEvent(frame.event);
}

refreshNodes();
refreshSessions();
refreshPersonas();
refreshSkillRepos();
setInterval(refreshNodes, 5000);
setInterval(refreshSessions, 3000);
setInterval(refreshPersonas, 30000);
setInterval(refreshSkillRepos, 30000);
</script>
